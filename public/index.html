<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08213D" />
    <meta
      name="description"
      content="Netrivium Technologies - Empowering businesses with intelligent connectivity, scalable networking solutions, and innovative SaaS & AI/ML development"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.netrivium.com/" />

    <!-- Brand font: Montserrat (display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Netrivium Technologies" />
    <meta property="og:title" content="Netrivium Technologies | Intelligent Connectivity Solutions" />
    <meta property="og:description" content="Empowering businesses with intelligent connectivity, scalable networking solutions, and innovative SaaS & AI/ML development." />
    <meta property="og:url" content="https://www.netrivium.com/" />
    <meta property="og:image" content="https://www.netrivium.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Netrivium Technologies | Intelligent Connectivity Solutions" />
    <meta name="twitter:description" content="Empowering businesses with intelligent connectivity, scalable networking solutions, and innovative SaaS & AI/ML development." />
    <meta name="twitter:image" content="https://www.netrivium.com/og-image.png" />

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Netrivium Technologies",
        "url": "https://www.netrivium.com/",
        "logo": "https://www.netrivium.com/logo512.png",
        "description": "Empowering businesses with intelligent connectivity, scalable networking solutions, and innovative SaaS & AI/ML development.",
        "email": "info@netrivium.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressRegion": "Telangana",
          "addressCountry": "IN"
        }
      }
    </script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.svg" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Netrivium Technologies | Intelligent Connectivity Solutions</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
